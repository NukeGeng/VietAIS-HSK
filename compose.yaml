name: vietais-hsk

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vietais_hsk
      POSTGRES_USER: vietais
      POSTGRES_PASSWORD: vietais_local_only
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - vietais-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vietais -d vietais_hsk"]
      interval: 5s
      timeout: 5s
      retries: 12

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: vietais
      RABBITMQ_DEFAULT_PASS: vietais_local_only
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - vietais-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=vietais_hsk;Username=vietais;Password=vietais_local_only
      ConnectionStrings__RabbitMq: amqp://vietais:vietais_local_only@rabbitmq:5672/
      Messaging__EnableWolverine: "true"
      Workers__Callback__SharedSecret: ${WORKER_CALLBACK_SHARED_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 6
    ports:
      - "${API_PORT:-5055}:8080"

  worker:
    profiles: ["workers"]
    build:
      context: .
      dockerfile: deploy/Dockerfile.worker
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=vietais_hsk;Username=vietais;Password=vietais_local_only
      ConnectionStrings__RabbitMq: amqp://vietais:vietais_local_only@rabbitmq:5672/
      Workers__ApiBaseUrl: http://api:8080
      Workers__Callback__SharedSecret: ${WORKER_CALLBACK_SHARED_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: on-failure:5

  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 6
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  vietais-postgres:
  vietais-rabbitmq:
